[project]
name = "google-visibility-report"
version = "0.1.0"
description = "Plain-English weekly Google visibility reports for small businesses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "uvicorn[standard]>=0.30.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.33.0",
  "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["app"]

